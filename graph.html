<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060814">
<title>土豆 Lauren Tan 的 AI 用法 · 星云图</title>
<style>
@font-face{
  font-family:'Smiley Sans';
  src:url('fonts/smiley-sans-subset.woff2') format('woff2');
  font-weight:normal;font-style:normal;font-display:swap;
}
:root{
  --bg:#060814;
  --ink:#e8ecf8;
  --muted:#929bbd;
  --line:rgba(140,160,230,.18);
  --panel-w:344px;
  --font-ui:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-title:'Smiley Sans',-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:
    radial-gradient(130% 90% at 50% -10%, #101736 0%, rgba(10,14,32,0) 60%),
    radial-gradient(90% 70% at 85% 110%, #0d1030 0%, rgba(10,14,32,0) 55%),
    var(--bg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}
#cv.pointing{cursor:pointer}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(2,3,8,.55) 100%);}

/* ---------- top bar ---------- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:14px 18px 10px;
  pointer-events:none;
}
.brand{min-width:0}
.site-nav{
  display:inline-flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(15,20,40,.72);border:1px solid var(--line);
  pointer-events:auto;margin-bottom:9px;
}
.site-nav a{
  font-size:12px;line-height:1;text-decoration:none;color:var(--muted);
  padding:6px 13px;border-radius:999px;transition:color .2s,background .2s;
}
.site-nav a.active{color:#ffd98a;background:rgba(255,209,102,.12)}
.brand h1{
  font-family:var(--font-title);font-weight:400;
  font-size:21px;letter-spacing:.5px;line-height:1.25;
  background:linear-gradient(92deg,#ffffff 30%,#ffd9a0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
.brand .sub b{color:#c3cbe8;font-weight:600}

.controls{
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  pointer-events:auto;flex-shrink:0;
}
.search{position:relative;width:252px}
.search input{
  width:100%;height:34px;padding:0 12px 0 32px;border-radius:10px;
  border:1px solid var(--line);outline:none;color:var(--ink);font-size:13px;
  background:rgba(13,17,33,.8);
  transition:border-color .2s;
}
.search input::placeholder{color:#6b7394}
.search input:focus{border-color:rgba(255,209,102,.45)}
.search .icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:#6b7394;font-size:14px;pointer-events:none;
}
#searchResults{
  position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:264px;overflow:auto;
  background:rgba(12,16,32,.96);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.5);display:none;
}
#searchResults.show{display:block}
.sr-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 12px;background:none;border:none;color:var(--ink);cursor:pointer;font-size:12.5px;font-family:var(--font-ui)}
.sr-item:hover,.sr-item.hot{background:rgba(255,255,255,.06)}
.sr-item .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sr-item .sum{color:#6f7796;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px 0 currentColor}

.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:340px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:999px;border:1px solid var(--line);cursor:pointer;
  background:rgba(13,17,33,.72);color:#cdd4ee;font-size:11.5px;font-family:var(--font-ui);
  transition:opacity .2s;
}
.chip b{color:#7f88ab;font-weight:500;font-size:10.5px}
.chip.off{opacity:.35}
.chip.off .dot{background:#555d78 !important;box-shadow:none}
.chip:hover{border-color:rgba(255,255,255,.25)}

/* ---------- detail panel / drawer ---------- */
#panel{
  position:fixed;z-index:30;
  right:14px;top:86px;bottom:16px;width:var(--panel-w);
  background:rgba(11,15,29,.93);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 18px 48px rgba(0,0,0,.55);
  transform:translateX(calc(100% + 30px));transition:transform .32s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#panel.open{transform:translateX(0)}
#panelClose{
  position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);
  font-size:15px;line-height:1;cursor:pointer;z-index:2;
}
#panelClose:hover{color:#fff;background:rgba(255,255,255,.12)}
.p-scroll{overflow-y:auto;padding:18px 18px 20px;-webkit-overflow-scrolling:touch}
.p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding-right:30px}
.badge{
  display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;letter-spacing:.5px;
}
#pDate{font-size:11.5px;color:var(--muted)}
#pTitle{
  font-family:var(--font-title);font-weight:400;font-size:21px;line-height:1.3;
  letter-spacing:.4px;margin-bottom:12px;padding-right:26px;word-break:break-word;
}
.p-sec{margin-top:14px}
.p-sec h3{
  font-size:11px;font-weight:600;color:#7c85a8;letter-spacing:2px;margin-bottom:7px;
}
.p-sec p{font-size:13px;line-height:1.75;color:#c9d0e8}
#pRefs{display:flex;flex-wrap:wrap;gap:6px}
#pRefs span{
  font-size:11px;color:#a9b2d4;background:rgba(255,255,255,.06);
  border:1px solid var(--line);padding:2px 8px;border-radius:6px;
}
#pLink{
  display:inline-block;max-width:100%;font-size:12.5px;color:#8fc6ff;text-decoration:none;
  border:1px solid rgba(143,198,255,.3);background:rgba(143,198,255,.08);
  padding:6px 12px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#pLink:hover{background:rgba(143,198,255,.16)}
.nb-group{margin-bottom:12px}
.nb-group h4{font-size:11px;color:#7c85a8;font-weight:500;margin-bottom:5px;letter-spacing:1px}
.nb{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 8px;margin:0 0 2px;border:none;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.03);color:var(--ink);font-size:12.5px;font-family:var(--font-ui);
  transition:background .15s;
}
.nb:hover{background:rgba(255,255,255,.09)}
.nb .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .ev{font-size:10.5px;color:#6f7796;flex-shrink:0}

/* ---------- misc ---------- */
#hint{
  position:fixed;left:18px;bottom:14px;z-index:10;font-size:11px;
  color:#5f6787;pointer-events:none;letter-spacing:.3px;
}
#dataError{
  position:fixed;inset:0;display:none;place-items:center;z-index:50;
  color:var(--muted);font-size:14px;text-align:center;padding:20px;
}

@media (max-width:699.98px){
  #topbar{padding:12px 14px 8px;flex-direction:column;align-items:stretch;gap:10px}
  .brand h1{font-size:17px;white-space:normal}
  .site-nav{margin-bottom:7px}
  .controls{flex-direction:column;align-items:stretch}
  .search{width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;
    padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0}
  #panel{
    left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;
    border-radius:18px 18px 0 0;transform:translateY(112%);
  }
  #panel.open{transform:translateY(0)}
  .p-scroll{padding:16px 16px 26px}
  #hint{display:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vignette"></div>

<header id="topbar">
  <div class="brand">
    <nav class="site-nav" aria-label="站内导航">
      <a href="./index.html">长文</a><a class="active" href="./graph.html" aria-current="page">星云图</a><a href="./galaxy.html">星系</a>
    </nav>
    <h1>土豆 Lauren Tan 的 AI 用法 · 星云图</h1>
    <p class="sub" id="statLine">加载中…</p>
  </div>
  <div class="controls">
    <div class="search">
      <span class="icon" aria-hidden="true">⌕</span>
      <input id="searchInput" type="text" placeholder="搜索节点：标题 / 摘要" autocomplete="off" spellcheck="false">
      <div id="searchResults" role="listbox"></div>
    </div>
    <div class="chips" id="chips" aria-label="类别筛选"></div>
  </div>
</header>

<aside id="panel" aria-hidden="true">
  <button id="panelClose" aria-label="关闭">✕</button>
  <div class="p-scroll">
    <div class="p-head">
      <span class="badge" id="pType"></span>
      <span id="pDate"></span>
    </div>
    <h2 id="pTitle"></h2>
    <div class="p-sec" id="secSummary"><h3>摘 要</h3><p id="pSummary"></p></div>
    <div class="p-sec" id="secRefs"><h3>参考</h3><div id="pRefs"></div></div>
    <div class="p-sec" id="secLink"><h3>原文链接</h3><a id="pLink" target="_blank" rel="noopener noreferrer"></a></div>
    <div class="p-sec" id="secNeighbors"><h3>关联节点</h3><div id="pNeighbors"></div></div>
  </div>
</aside>

<p id="hint">拖动平移 · 滚轮/双指缩放 · 点按节点查看详情 · 点空白取消</p>
<div id="dataError">图谱数据未能加载，请确认 graph-data.js 存在。</div>

<script src="lib/d3.min.js"></script>
<script src="graph-data.js"></script>
<script>
(function(){
'use strict';

/* ============ 数据 & 常量 ============ */
if (!window.GRAPH_DATA || !Array.isArray(window.GRAPH_DATA.nodes)) {
  document.getElementById('dataError').style.display = 'grid';
  return;
}
const DATA = window.GRAPH_DATA;

const TYPE_META = {
  person:      { name:'人物',   color:'#ff6b8a' },
  tool:        { name:'工具',   color:'#4dd6ff' },
  concept:     { name:'概念',   color:'#b18aff' },
  post:        { name:'帖子',   color:'#ffb35c' },
  third_party: { name:'第三方', color:'#5fe0a8' },
  time:        { name:'时间',   color:'#8a94ff' },
};
const CORE_TYPES = new Set(['person','tool','concept']);
const EDGE_COLOR = { mentions:'#ffd166', belongs_to:'#93a7ff', evolves_to:'#5fe0a8', interprets:'#ff8fd0' };
const REL = {
  mentions:   { out:'提到',   in:'被提到' },
  belongs_to: { out:'属于',   in:'包含' },
  evolves_to: { out:'演进为', in:'演进自' },
  interprets: { out:'解读',   in:'被解读' },
};
const EDGE_ORDER = ['mentions','belongs_to','evolves_to','interprets'];
/* 每个类别的引力中心：person 居中，其余各类放在周围轨道上。
   轨道半径与簇估计半径都按节点数自动推算，适配任意数据规模。 */
const _tc = {};
DATA.nodes.forEach(n=>_tc[n.type]=(_tc[n.type]||0)+1);
const CLUSTER = { person:[0,0] };
const CLUSTER_R = { person:26 };                 // 簇估计半径（用于雾团大小/轨道间距）
const ANGLE = { post:-95, tool:-25, concept:35, time:115, third_party:190 };
let _maxRc = 0;
for (const k in ANGLE){
  CLUSTER_R[k] = Math.sqrt(_tc[k]||1)*20 + 12;
  if (CLUSTER_R[k]>_maxRc) _maxRc = CLUSTER_R[k];
}
const ORBIT = Math.max(430, _maxRc*2.35);
for (const k in ANGLE){
  const a = ANGLE[k]*Math.PI/180;
  CLUSTER[k] = [Math.cos(a)*ORBIT, Math.sin(a)*ORBIT];
}
/* 雾团（星云背景光斑）半径 */
const MIST_R = {};
for (const k in CLUSTER) MIST_R[k] = CLUSTER_R[k]*2.0 + 70;
MIST_R.person = 150;
/* 簇引力强度：簇越大越松，让小簇紧凑、大簇舒展 */
const CLUSTER_STRENGTH = { person:0.5, post:0.13, tool:0.16, concept:0.16, time:0.17, third_party:0.16 };

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (()=>{ let s=20260601; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; })();

/* 节点/边准备（度数、半径、漂移参数）——不写死任何节点 */
const nodes = DATA.nodes.map(d=>{
  const n = Object.assign({}, d);
  n.deg = 0;
  return n;
});
const byId = new Map(nodes.map(n=>[n.id,n]));
const edges = (DATA.edges||[])
  .filter(e=>byId.has(e.source) && byId.has(e.target))
  .map(e=>Object.assign({}, e));
edges.forEach(e=>{ byId.get(e.source).deg++; byId.get(e.target).deg++; });
nodes.forEach(n=>{
  n.r = clamp(3.2 + Math.sqrt(n.deg)*1.35, 3.2, 17);
  n.phase = rnd()*Math.PI*2;
  n.driftAmp = REDUCED ? 0 : 0.9 + rnd()*1.5;
  n.driftSpd = 0.00022 + rnd()*0.00028;
  n.fx = null; n.fy = null;
  n._gx = n.x; n._gy = n.y; n._sx = 0; n._sy = 0;
});
const adj = new Map(nodes.map(n=>[n.id,[]]));
edges.forEach(e=>{
  adj.get(e.source).push({ other:byId.get(e.target), e });
  adj.get(e.target).push({ other:byId.get(e.source), e });
});
const typeCount = {};
nodes.forEach(n=>typeCount[n.type]=(typeCount[n.type]||0)+1);

/* ============ 画布 & 发光精灵 ============ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let dpr = Math.min(window.devicePixelRatio||1, 2), vw=0, vh=0;
function resize(){
  vw = window.innerWidth; vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.round(vw*dpr); canvas.height = Math.round(vh*dpr);
}
window.addEventListener('resize', resize);
resize();

function makeSprite(color, soft){
  const S=128, c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d'), gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  const [r,grn,b] = [1,3,5].map(i=>parseInt(color.slice(i,i+2),16));
  const rgba=a=>`rgba(${r},${grn},${b},${a})`;
  if (soft){
    gr.addColorStop(0, rgba(.16)); gr.addColorStop(.45, rgba(.07)); gr.addColorStop(1, rgba(0));
  }else{
    gr.addColorStop(0,'rgba(255,255,255,.95)');
    gr.addColorStop(.10, rgba(.9));
    gr.addColorStop(.30, rgba(.34));
    gr.addColorStop(.65, rgba(.09));
    gr.addColorStop(1, rgba(0));
  }
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  return c;
}
const sprites = {}, softSprites = {};
for (const k in TYPE_META){
  sprites[k] = makeSprite(TYPE_META[k].color, false);
  softSprites[k] = makeSprite(TYPE_META[k].color, true);
}

/* 星点背景 */
const stars = [];
for (let i=0;i<170;i++){
  stars.push({
    x:rnd(), y:rnd(),
    s: rnd()<.86 ? (0.5+rnd()*0.9) : (1.4+rnd()*0.9),
    a: .25+rnd()*.6,
    p: .02+rnd()*.1,
    tw: .0006+rnd()*.0012,
    ph: rnd()*Math.PI*2,
    c: rnd()<.75 ? '220,228,255' : (rnd()<.5 ? '255,222,170' : '170,190,255'),
  });
}

/* ============ 力布局 ============ */
/* 边分簇内/跨簇：簇内边短而紧（撑起内部结构），跨簇边长而弱（不拖散聚团） */
edges.forEach(e=>{ e._same = byId.get(e.source).type===byId.get(e.target).type; });
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d=>d.id)
    .distance(e=>e._same ? 38 : 130)
    .strength(e=>e._same ? (e.type==='belongs_to'?0.32:0.26) : 0.032))
  .force('charge', d3.forceManyBody().strength(-65).distanceMax(800))
  .force('collide', d3.forceCollide().radius(d=>d.r*2.6).iterations(2))
  .force('cx', d3.forceX(d=>CLUSTER[d.type]?CLUSTER[d.type][0]:0)
    .strength(d=>CLUSTER_STRENGTH[d.type]||0.12))
  .force('cy', d3.forceY(d=>CLUSTER[d.type]?CLUSTER[d.type][1]:0)
    .strength(d=>CLUSTER_STRENGTH[d.type]||0.12))
  .velocityDecay(0.4)
  .stop();
for (let i=0;i<400;i++) sim.tick();   // 同步预演算：页面打开即是成形的稳定星云
/* 布局保持静止，仅靠渲染层的正弦漂移产生“缓慢漂移”感，避免镜头/位置漂移 */

/* ============ 缩放 / 视口 fit ============ */
const canvasSel = d3.select(canvas);
const t = d3.zoomIdentity;
let userMoved = false, autofit = true;

function fitTarget(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (const n of nodes){
    if (n.x<minX)minX=n.x; if (n.x>maxX)maxX=n.x;
    if (n.y<minY)minY=n.y; if (n.y>maxY)maxY=n.y;
  }
  const padS=24, padT=vw<700?Math.min(vh*0.24,195):140, padB=vw<700?50:34;
  const k = clamp(Math.min((vw-2*padS)/(maxX-minX+1), (vh-padT-padB)/(maxY-minY+1)), 0.08, 1.8);
  /* 以度数加权的质心为视觉中心（若包围盒放不下则退回普通居中） */
  let wsum=0, wx=0, wy=0;
  for (const n of nodes){ const w=n.deg+1; wsum+=w; wx+=n.x*w; wy+=n.y*w; }
  wx/=wsum; wy/=wsum;
  const cx = padS - k*minX <= vw-padS - k*maxX
    ? clamp(vw/2 - k*wx, padS - k*minX, vw-padS - k*maxX)
    : (vw - k*(minX+maxX))/2;
  const cy = padT - k*minY <= vh-padB - k*maxY
    ? clamp((padT+vh-padB)/2 - k*wy, padT - k*minY, vh-padB - k*maxY)
    : padT + (vh-padT-padB - k*(minY+maxY))/2;
  return { k, x:cx, y:cy };
}
const zoom = d3.zoom()
  .scaleExtent([0.08, 8])
  .filter(ev=>{
    if (drag.active) return false;
    if (ev.type==='dblclick') return false;
    return !ev.button;
  })
  .on('start', ()=>{ userMoved=true; canvas.classList.add('dragging'); })
  .on('end',   ()=>{ canvas.classList.remove('dragging'); })
  .on('zoom', ev=>{ t.x=ev.transform.x; t.y=ev.transform.y; t.k=ev.transform.k; });
canvasSel.call(zoom).on('dblclick.zoom', null);
(function applyInitialFit(){
  const f = fitTarget();
  const t0 = d3.zoomIdentity.translate(f.x,f.y).scale(f.k);
  zoom.transform(canvasSel, t0);
})();

function applyT(x,y,k){
  zoom.transform(canvasSel, d3.zoomIdentity.translate(x,y).scale(k));
}
let tweenTimer=null;
function tweenTo(tx,ty,tk){
  if (tweenTimer) tweenTimer.stop();
  if (REDUCED){ applyT(tx,ty,tk); return; }
  const interp = d3.interpolateZoom([t.x,t.y,t.k],[tx,ty,tk]);
  const dur = clamp(interp.duration, 350, 900);
  tweenTimer = d3.timer(el=>{
    const p=Math.min(1,el/dur), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    const v=interp(e);
    applyT(v[0],v[1],v[2]);
    if (p>=1) return true;
  });
}

/* ============ 选中 / 高亮状态 ============ */
let selected=null, highlightSet=null, hoverId=null, searchedId=null;
const hidden = new Set();

function selectNode(id, opts){
  opts = opts||{};
  const n = byId.get(id);
  if (!n || hidden.has(n.type)) return;
  selected = n;
  highlightSet = new Set([id]);
  adj.get(id).forEach(a=>highlightSet.add(a.other.id));
  renderPanel(n);
  panel.setAttribute('aria-hidden','false');
  panel.classList.add('open');
  if (opts.center){
    autofit = false;
    let cx=vw/2, cy=vh/2;
    if (vw>=700) cx=(vw-350)/2; else cy=vh*0.31;
    const tk = Math.max(t.k, opts.k||1.7);
    tweenTo(cx - tk*n.x, cy - tk*n.y, tk);
  }
}
function deselect(){
  selected=null; highlightSet=null;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden','true');
}

/* ============ 渲染 ============ */
let simSettled=false;
sim.on('end', ()=>{ simSettled=true; });

function frame(now){
  requestAnimationFrame(frame);
  const w=vw, h=vh;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  /* 自适应 fit（用户未交互前，跟随布局微调） */
  if (autofit && !userMoved && !selected && now<6000){
    const f=fitTarget();
    const e = REDUCED?1:0.09;
    t.x += (f.x-t.x)*e; t.y += (f.y-t.y)*e; t.k += (f.k-t.k)*e;
    applyT(t.x,t.y,t.k);
  }

  /* 星点（带轻微视差 + 闪烁） */
  for (const s of stars){
    const sx=((s.x*w - t.x*s.p)%w+w)%w;
    const sy=((s.y*h - t.y*s.p)%h+h)%h;
    const tw = REDUCED?1:(0.7+0.3*Math.sin(now*s.tw+s.ph));
    ctx.fillStyle=`rgba(${s.c},${(s.a*tw).toFixed(3)})`;
    ctx.fillRect(sx,sy,s.s,s.s);
  }

  /* 节点坐标（含漂移）与屏幕坐标缓存 */
  for (const n of nodes){
    const dx=n.driftAmp?n.driftAmp*Math.sin(now*n.driftSpd+n.phase):0;
    const dy=n.driftAmp?n.driftAmp*Math.cos(now*n.driftSpd*0.9+n.phase*1.7):0;
    n._gx=n.x+dx; n._gy=n.y+dy;
    n._sx=n._gx*t.k+t.x; n._sy=n._gy*t.k+t.y;
  }

  /* ---- 以下在虚拟坐标系（应用 zoom 变换）---- */
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.scale(t.k, t.k);

  /* 星云雾团（每类一抹） */
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.62;
  for (const k in CLUSTER){
    let sx=0,sy=0,c=0;
    for (const n of nodes) if (n.type===k && !hidden.has(k)){ sx+=n._gx; sy+=n._gy; c++; }
    if (!c) continue;
    sx/=c; sy/=c;
    const R=MIST_R[k]||230;
    ctx.drawImage(softSprites[k], sx-R, sy-R, R*2, R*2);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  /* 边 */
  const tK=t.k;
  for (const e of edges){
    const s=e.source, tg=e.target;
    if (hidden.has(s.type)||hidden.has(tg.type)) continue;
    let a=0.10, col='#8ea0d8', lw=1;
    if (selected){
      if (s.id===selected.id||tg.id===selected.id){ col=EDGE_COLOR[e.type]||'#8ea0d8'; a=0.85; lw=1.5; }
      else a=0.035;
    }
    ctx.strokeStyle=col; ctx.globalAlpha=a; ctx.lineWidth=lw;
    ctx.beginPath();
    ctx.moveTo(s._gx,s._gy); ctx.lineTo(tg._gx,tg._gy);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  /* 节点光晕（精灵图，lighter 混合） */
  ctx.globalCompositeOperation='lighter';
  const G=3.0;
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const hl = highlightSet ? highlightSet.has(n.id) : false;
    const dim = highlightSet && !hl;
    let scale = G * (n.id===hoverId||n.id===searchedId ? 1.18 : 1);
    if (hl) scale = G*1.45;
    ctx.globalAlpha = dim ? 0.14 : (hl?0.95:0.82);
    const s = n.r*scale;
    ctx.drawImage(sprites[n.type], n._gx-s, n._gy-s, s*2, s*2);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;

  /* 节点核心 + 选中环 */
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const hl = highlightSet ? highlightSet.has(n.id) : false;
    const dim = highlightSet && !hl;
    ctx.globalAlpha = dim?0.25:1;
    ctx.fillStyle = TYPE_META[n.type].color;
    ctx.beginPath(); ctx.arc(n._gx,n._gy,n.r,0,6.2832); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(n._gx,n._gy,n.r*0.42,0,6.2832); ctx.fill();
    if ((selected && n.id===selected.id) || n.id===searchedId){
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.2/Math.max(tK,0.4);
      ctx.beginPath(); ctx.arc(n._gx,n._gy,n.r+4.5,0,6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  ctx.restore();

  /* 标签（屏幕坐标绘制，贪心避让防重叠） */
  ctx.textAlign='center'; ctx.textBaseline='top';
  const showAll = tK>=1.35;
  const labels=[];
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const hl = highlightSet ? highlightSet.has(n.id) : false;
    const dim = highlightSet && !hl;
    const core = CORE_TYPES.has(n.type);
    let show = core || showAll || hl || n.id===hoverId || n.id===searchedId;
    if (dim && !core) show=false;
    if (!show) continue;
    let lab = n.label; if (lab.length>18) lab=lab.slice(0,17)+'…';
    const pri = (n.id===selected?.id||n.id===hoverId||n.id===searchedId)?3:(hl?2:core?1:0);
    labels.push({n, lab, pri});
  }
  labels.sort((a,b)=>b.pri-a.pri || b.n.deg-a.n.deg || b.n.r-a.n.r);
  const placed=[];
  /* 节点本身也是障碍物：标签不许盖住任何节点 */
  const obstacles=[];
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const rad=n.r*tK+3;
    n._obst={x:n._sx-rad, y:n._sy-rad, w:rad*2, h:rad*2};
    obstacles.push(n._obst);
  }
  const MAXL = vw<700 ? 30 : 52;
  for (const L of labels){
    if (placed.length>=MAXL) break;
    const fs = CORE_TYPES.has(L.n.type)?12:11;
    ctx.font = `${fs}px -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
    const tw = ctx.measureText(L.lab).width;
    const bx=clamp(L.n._sx, tw/2+8, w-tw/2-8);
    const by=L.n._sy+L.n.r*tK+8;
    /* 只在竖直方向避让（水平横移会让标签“找不到自己的节点”） */
    const step=fs+5;
    const cands=[[0,0],[0,-1],[0,1],[0,-2],[0,2]];
    let pick=null;
    for (const [ox,oy] of cands){
      const lx=bx, ly=by+oy*step;
      const rect={x:lx-tw/2-3, y:ly-1, w:tw+6, h:fs+4};
      let clash=false;
      for (const r of placed){
        if (rect.x<r.x+r.w && r.x<rect.x+rect.w && rect.y<r.y+r.h && r.y<rect.y+r.h){ clash=true; break; }
      }
      if (!clash){
        for (const r of obstacles){
          if (r===L.n._obst) continue;
          if (rect.x<r.x+r.w && r.x<rect.x+rect.w && rect.y<r.y+r.h && r.y<rect.y+r.h){ clash=true; break; }
        }
      }
      if (!clash){ pick={lx,ly,rect}; break; }
    }
    if (!pick){
      if (L.pri>=2){ pick={lx:bx,ly:by,rect:{x:bx-tw/2-3,y:by-1,w:tw+6,h:fs+4}}; }
      else continue;
    }
    placed.push(pick.rect);
    const {lx,ly}=pick;
    /* 标签被迫离开节点正下方时，画一条细引线保持归属关系 */
    if (Math.abs(ly-by)>step*1.2 || Math.abs(lx-bx)>2){
      ctx.globalAlpha=0.35;
      ctx.strokeStyle='rgba(168,180,220,0.4)';
      ctx.lineWidth=0.7;
      ctx.beginPath();
      ctx.moveTo(L.n._sx, L.n._sy + L.n.r*tK + 3);
      ctx.lineTo(lx, ly-2);
      ctx.stroke();
    }
    ctx.globalAlpha = L.pri>=2?1:0.92;
    ctx.fillStyle='rgba(4,6,14,0.85)'; ctx.fillText(L.lab,lx+1,ly+1);
    ctx.fillStyle= L.pri>=2?'#ffffff':'rgba(226,232,250,0.96)';
    ctx.fillText(L.lab,lx,ly);
  }
  ctx.globalAlpha=1;
}
requestAnimationFrame(frame);

/* ============ 命中检测 & 指针交互 ============ */
function pointerPos(ev){
  const r=canvas.getBoundingClientRect();
  return { x:ev.clientX-r.left, y:ev.clientY-r.top };
}
function hitNode(p){
  let best=null, bestD=1e9;
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const dx=p.x-n._sx, dy=p.y-n._sy;
    const d=Math.sqrt(dx*dx+dy*dy);
    const R=Math.max(n.r*t.k+7, 13);
    if (d<R && d<bestD){ best=n; bestD=d; }
  }
  return best;
}
const drag={ active:false, node:null };
const down={ x:0,y:0,t:0,moved:false,node:null,pointers:new Map() };

canvas.addEventListener('pointerdown', ev=>{
  const p=pointerPos(ev);
  down.pointers.set(ev.pointerId,{x:p.x,y:p.y});
  if (down.pointers.size>1){ drag.active=false; drag.node=null; return; }
  down.x=p.x; down.y=p.y; down.t=performance.now(); down.moved=false;
  const n=hitNode(p);
  down.node=n;
  if (n){
    drag.active=true; drag.node=n;
    userMoved=true; autofit=false;
    if (tweenTimer) tweenTimer.stop();
    n.fx=n.x; n.fy=n.y;
    sim.alphaTarget(0.06);
    if (sim.alpha()<0.03) sim.alpha(0.06);
    sim.restart();
    try{ canvas.setPointerCapture(ev.pointerId); }catch(_){}
  }
});
window.addEventListener('pointermove', ev=>{
  if (ev.pointerId && down.pointers.has(ev.pointerId)){
    const p0=down.pointers.get(ev.pointerId);
    const p=pointerPos(ev);
    if (Math.hypot(p.x-p0.x,p.y-p0.y)>6) down.moved=true;
    if (down.pointers.size===1 && drag.node){
      drag.node.fx=(p.x-t.x)/t.k;
      drag.node.fy=(p.y-t.y)/t.k;
    }
  }
  if (ev.pointerType==='mouse' && !down.pointers.size){
    const n=hitNode(pointerPos(ev));
    hoverId=n?n.id:null;
    canvas.classList.toggle('pointing', !!n);
  }
});
function pointerEnd(ev){
  down.pointers.delete(ev.pointerId);
  if (drag.node){
    drag.node.fx=null; drag.node.fy=null;
    sim.alphaTarget(0);
  }
  if (down.pointers.size===0){
    const wasDrag=drag.active;
    const node=down.node;
    drag.active=false; drag.node=null;
    if (!down.moved && performance.now()-down.t<600){
      if (node) selectNode(node.id,{});
      else if (wasDrag || selected) deselect();
    }
    down.node=null;
  }
}
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);

/* ============ 详情面板 ============ */
const panel=document.getElementById('panel');
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function renderPanel(n){
  const meta=TYPE_META[n.type]||{name:n.type,color:'#8ea0d8'};
  const badge=$('pType');
  badge.textContent=meta.name;
  badge.style.color=meta.color;
  badge.style.background=meta.color+'26';
  badge.style.border=`1px solid ${meta.color}55`;
  $('pDate').textContent=n.date||'';
  $('pDate').style.display=n.date?'':'none';
  $('pTitle').textContent=n.label||n.id;
  $('secSummary').style.display=n.summary?'':'none';
  $('pSummary').textContent=n.summary||'';
  $('secRefs').style.display=(n.refs&&n.refs.length)?'':'none';
  $('pRefs').innerHTML=(n.refs||[]).map(r=>`<span>${esc(r)}</span>`).join('');
  $('secLink').style.display=n.url?'':'none';
  const link=$('pLink');
  if (n.url){ link.href=n.url; link.textContent=n.url.replace(/^https?:\/\//,''); }
  /* 邻居按边类型+方向分组 */
  const groups=new Map();
  (adj.get(n.id)||[]).forEach(a=>{
    const dir=a.e.source===n.id?'out':'in';
    const key=a.e.type+':'+dir;
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(a);
  });
  let html='';
  EDGE_ORDER.forEach(et=>{
    ['out','in'].forEach(dir=>{
      const list=groups.get(et+':'+dir);
      if(!list||!list.length) return;
      html+=`<div class="nb-group"><h4>${REL[et][dir]} · ${list.length}</h4>`;
      list.sort((a,b)=>(a.other.label||'').localeCompare(b.other.label||'','zh'));
      list.forEach(a=>{
        const om=TYPE_META[a.other.type]||{color:'#8ea0d8'};
        html+=`<button class="nb" data-id="${esc(a.other.id)}">
          <span class="dot" style="background:${om.color};color:${om.color}"></span>
          <span class="lab">${esc(a.other.label||a.other.id)}</span>
          ${a.e.evidence?`<span class="ev">${esc(a.e.evidence)}</span>`:''}</button>`;
      });
      html+='</div>';
    });
  });
  $('pNeighbors').innerHTML=html || '<p style="font-size:12px;color:#6f7796">暂无关联节点</p>';
}
$('pNeighbors').addEventListener('click', ev=>{
  const btn=ev.target.closest('.nb');
  if (btn) selectNode(btn.dataset.id,{center:true,k:1.8});
});
$('panelClose').addEventListener('click', deselect);
window.addEventListener('keydown', ev=>{
  if (ev.key==='Escape'){ deselect(); hideSearch(); }
});

/* ============ 类别筛选 chips ============ */
const chipsEl=$('chips');
Object.keys(TYPE_META).forEach(k=>{
  const m=TYPE_META[k];
  const b=document.createElement('button');
  b.className='chip'; b.dataset.type=k;
  b.innerHTML=`<span class="dot" style="background:${m.color};color:${m.color}"></span>${m.name}<b>${typeCount[k]||0}</b>`;
  b.addEventListener('click', ()=>{
    if (hidden.has(k)) hidden.delete(k); else hidden.add(k);
    b.classList.toggle('off', hidden.has(k));
    if (selected && hidden.has(selected.type)) deselect();
  });
  chipsEl.appendChild(b);
});

/* ============ 搜索 ============ */
const sInput=$('searchInput'), sBox=$('searchResults');
function hideSearch(){ sBox.classList.remove('show'); }
function doSearch(q){
  q=q.trim().toLowerCase();
  if (!q){ hideSearch(); return; }
  const res=[];
  for (const n of nodes){
    if (hidden.has(n.type)) continue;
    const lab=(n.label||'').toLowerCase(), sum=(n.summary||'').toLowerCase();
    let sc=0;
    if (lab===q) sc=4;
    else if (lab.startsWith(q)) sc=3;
    else if (lab.includes(q)) sc=2;
    else if (sum.includes(q)) sc=1;
    if (sc) res.push({n,sc});
  }
  res.sort((a,b)=>b.sc-a.sc || (a.n.label||'').localeCompare(b.n.label||'','zh'));
  const top=res.slice(0,8);
  if (!top.length){
    sBox.innerHTML='<div class="sr-item" style="color:#6f7796;cursor:default">无匹配结果</div>';
  }else{
    sBox.innerHTML=top.map((r,i)=>{
      const m=TYPE_META[r.n.type]||{color:'#8ea0d8'};
      return `<button class="sr-item${i===0?' hot':''}" data-id="${esc(r.n.id)}" role="option">
        <span class="dot" style="background:${m.color};color:${m.color}"></span>
        <span class="lab">${esc(r.n.label||r.n.id)}</span>
        <span class="sum">${esc(r.n.summary||'')}</span></button>`;
    }).join('');
  }
  sBox.classList.add('show');
}
sInput.addEventListener('input', ()=>doSearch(sInput.value));
sInput.addEventListener('focus', ()=>{ if(sInput.value.trim()) doSearch(sInput.value); });
sInput.addEventListener('keydown', ev=>{
  if (ev.key==='Enter'){
    const first=sBox.querySelector('.sr-item[data-id]');
    if (first){ pickSearch(first.dataset.id); }
  }else if (ev.key==='Escape'){ sInput.value=''; hideSearch(); sInput.blur(); }
});
sBox.addEventListener('pointerdown', ev=>{
  const item=ev.target.closest('.sr-item[data-id]');
  if (item){ ev.preventDefault(); pickSearch(item.dataset.id); }
});
function pickSearch(id){
  hideSearch(); sInput.value=''; sInput.blur();
  searchedId=id;
  selectNode(id,{center:true,k:1.9});
}
document.addEventListener('pointerdown', ev=>{
  if (!ev.target.closest('.search')) hideSearch();
});

/* ============ 统计 & focus 参数 ============ */
$('statLine').innerHTML=`节点 <b>${nodes.length}</b> · 边 <b>${edges.length}</b>`;

const focusId=new URLSearchParams(location.search).get('focus');
if (focusId && byId.has(focusId)){
  setTimeout(()=>selectNode(focusId,{center:true,k:1.8}), 400);
}
})();
</script>
</body>
</html>
